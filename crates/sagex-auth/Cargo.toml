[package]
name = "sagex-auth"
version = "0.1.0"
edition = "2021"
description = "Shared sagex identity primitives: username rules + server-issued ML-DSA-65 JOSE permits. Used by sagex-certauth (mint) and sagex-gateway (verify)."
license = "MIT"

[lib]
name = "sagex_auth"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustpq = { version = "0.3.0", features = ["mldsa65", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
