[package]
name = "sagex-certauth"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-certauth"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
mongodb = "3"
sagex-crypto = { path = "../sagex-crypto" }
sagex-format = { path = "../sagex-format" }
sagex-auth = { path = "../sagex-auth" }
rustpq = { version = "0.3.0", features = ["mldsa65", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
base64 = "0.22"
x509-cert = { version = "0.3", features = ["builder", "pem", "std"] }
der = "0.8"
spki = "0.8"
pem-rfc7468 = "1"
const-oid = "0.10"
zeroize = "1.9"
signature = "3"
binrw = "0.15.2"
