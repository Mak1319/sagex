[package]
name = "sagex-chatsrv"
version = "0.1.0"
edition = "2021"
description = "Simple chat REST + WebSocket server: auth (signup/login/OTP/forgot-password), rooms, DMs, history. JOSE tokens signed with ML-DSA-65 (RFC 9964)."
license = "UNLICENSED"

[[bin]]
name = "sagex-chatsrv"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
mongodb = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
argon2 = "0.6"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
futures = "0.3"
dashmap = "6"
thiserror = "2"
anyhow = "1"
rustpq = { version = "0.3.0", features = ["mldsa65", "std"] }
sagex-crypto = { path = "../sagex-crypto" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"
