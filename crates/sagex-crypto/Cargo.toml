[package]
name = "sagex-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
cryptoki = "0.12.1"
rand = "0.10.3"
rand_os = "0.2.2"
rustpq = { version = "0.3.0", features = ["x25519-mlkem768", "mldsa65", "std"] }
thiserror = "2.0.21"
tss-esapi = "7.7.0"
zeroize = { version = "1.9.0", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
