[package]
name = "sagex-crypto"
version = "0.1.0"
edition = "2024"


[dependencies]
aes-gcm = "0.11.1"
bytecheck = "0.8.3"
ml-dsa = "0.1.1"
ml-kem = { version = "0.3.2", features = ["getrandom"] }
pbkdf2 = "0.13.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["derive"] }
