[package]
name = "sagex-gateway"
version = "0.1.0"
edition = "2021"
description = "Register gateway: HTTP REST intake + SQLite outbox + PBFT ledger proxy. Sole writer path for decryption records."
license = "MIT"

[[bin]]
name = "sagex-gateway"
path = "src/main.rs"

[lib]
name = "sagex_gateway"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
sagex-ledger = { path = "../sagex-ledger" }
sagex-auth = { path = "../sagex-auth" }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
rustpq = { version = "0.3.0", features = ["mldsa65", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
