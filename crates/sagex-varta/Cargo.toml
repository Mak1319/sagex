[package]
name = "sagex-varta"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "=0.7.1", default-features = false, features = ["assets", "component"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
# Same major line as gpui 0.2.2's own resvg (0.45.0); shares the offline
# cargo cache. No text/font features: splash SVGs are pure paths.
resvg = { version = "0.45", default-features = false }
serde_json = "1"
