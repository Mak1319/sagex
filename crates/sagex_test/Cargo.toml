[package]
name = "sagex_test"
version = "0.1.0"
edition = "2024"

[dependencies]
sagex-crypto = { path = "../sagex-crypto" }
sagex-format = { path = "../sagex-format" }
sagex-appx = { path = "../sagex-appx" }
postcard = { version = "1.1.3", features = ["alloc"] }
wincode = "0.6.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
binrw = "0.15.2"

[features]
serde = ["dep:serde", "sagex-crypto/serde", "sagex-format/serde", "sagex-appx/serde"]
