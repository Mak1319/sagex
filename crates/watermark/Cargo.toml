[package]
name = "watermark"
version = "0.1.0"
edition = "2021"
description = "Hybrid DWT-DCT-DFT image watermarking (educational)"
license = "MIT"

[[bin]]
name = "watermark"
path = "src/main.rs"

[dependencies]
image = { version = "=0.25.6", features = ["png", "jpeg"] }
rustfft = { version = "=6.2.0" }
ndarray = { version = "=0.16.1" }
clap = { version = "=4.5.20", features = ["derive"] }
num-complex = { version = "=0.4.6" }
