[package]
name = "sagex-authsrv"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-authsrv"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dotenvy = "0.15"
base64 = "0.22"
mongodb = "3.9"
x509-cert = { version = "=0.3.0", features = ["builder"] }
der = "=0.8.2"
rand = "0.10"
spki = "0.8"
const-oid = "0.10"
pem-rfc7468 = "1.0"
signature = "3"
ml-dsa = { version = "0.1.1", features = ["getrandom", "rand_core", "zeroize"] }
sagex-crypto = { path = "../sagex-crypto" }
sagex-format = { path = "../sagex-format" }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
anyhow = "1"
tower = "0.5"
