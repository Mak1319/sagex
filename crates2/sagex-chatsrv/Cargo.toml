[package]
name = "sagex-chatsrv"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-chatsrv"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
mongodb = "3.9"
uuid = { version = "1.26", features = ["v4", "v7", "serde"] }
argon2 = "0.6"
password-hash = "0.6"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
chrono = "0.4"
toml = "1.1"
dotenvy = "0.15"
zeroize = "1.9"
sagex-crypto = { path = "../sagex-crypto" }
sagex-format = { path = "../sagex-format" }
postcard = { version = "1", features = ["use-std"] }
