[package]
name = "sagex-desk"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-desk"
path = "src/main.rs"

[dependencies]
gpui-component = "0.6.6"
gpui = { version = "=0.3.6", package = "gpui-pre" }
gpui-platform = { version = "=0.3.6", package = "gpui-pre-platform", features = ["wayland", "x11"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
keyring = "3"
dirs = "6"
toml = "1.1"
