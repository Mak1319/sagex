[package]
name = "sagex-keygen"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-keygen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
purecrypto-tpm = "0.1"
sagex-crypto = { path = "../sagex-crypto" }
sagex-format = { path = "../sagex-format" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
zeroize = "1.9"
