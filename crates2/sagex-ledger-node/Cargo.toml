[package]
name = "sagex-ledger-node"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-ledger-node"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
hex = "0.4"
toml = "1.1"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
