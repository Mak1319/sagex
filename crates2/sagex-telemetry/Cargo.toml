[package]
name = "sagex-telemetry"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sagex-telemetry"
path = "src/main.rs"

[dependencies]
gpui-component = "0.6.6"
gpui = { version = "=0.3.6", package = "gpui-pre" }
gpui-platform = { version = "=0.3.6", package = "gpui-pre-platform", features = ["x11", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
dirs = "6"
toml = "1.1"
sha2 = "0.11"
hex = "0.4"
rand = "0.10"
sagex-crypto = { path = "../sagex-crypto" }
