[package]
name = "sagex-archive"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kunji"
path = "src/bin/kunji.rs"

[[bin]]
name = "nidhi"
path = "src/bin/nidhi.rs"

[dependencies]
sagex-capsule = { path = "../sagex-capsule" }
sagex-keys = { path = "../sagex-keys" }
sagex-crypto = { path = "../sagex-crypto" }
sagex-safecap = { path = "../sagex-safecap" }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6"
dialoguer = "0.12.0"
rand = "0.10.3"
flate2 = "1"
crc32fast = "1"
binrw = "0.15.2"
rustix = { version = "1.1", features = ["process"] }
zeroize = { version = "1.9.0", features = ["derive"] }
