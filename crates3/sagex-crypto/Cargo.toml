[package]
name = "sagex-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
ml-dsa = { version = "0.1.1", features = ["zeroize"] }
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
pbkdf2 = "0.13.0"
rand = "0.10.3"
rkyv = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
shake = "0.1"
digest = "0.11"
thiserror = "2.0.21"
zeroize = { version = "1.9.0", features = ["derive"] }
